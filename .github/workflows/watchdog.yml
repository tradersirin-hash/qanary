name: Canary watchdog

# Every 30 minutes: read the canary and honeypot on each cluster. If a honeypot dropped below its baseline, trip that
# canary on-chain (check_honeypot is permissionless) and open an issue naming the cluster. The devnet job always runs;
# the mainnet job runs only once the repository variable MAINNET_CANARY is 'true' (set it after the mainnet canary is
# initialized). GitHub runs scheduled workflows only from the default branch, and pauses them after 60 days without
# commits; "Run workflow" starts one by hand, and its "force check" box sends check_honeypot on every cluster even when
# nothing dropped, to test the fee-payer keys.
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      force_check:
        description: Send check_honeypot even if nothing dropped (tests the fee-payer keys; it only refreshes the baseline)
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: canary-watchdog
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      # app/.npmrc sets ignore-scripts, so no dependency runs code at install time.
      - run: npm ci
      - id: check
        run: node scripts/watchdog.mjs
        env:
          CLUSTER: devnet
          # Optional: a devnet key that only pays fees. Without it the watchdog asks for a devnet airdrop,
          # which is often rate limited; the alert below is opened either way.
          WATCHDOG_KEYPAIR: ${{ secrets.WATCHDOG_KEYPAIR }}
          FORCE_CHECK: ${{ inputs.force_check && '1' || '' }}
      - name: Open an alert issue
        if: steps.check.outputs.status != 'alive'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CLUSTER: devnet
          LABEL: canary
          STATUS: ${{ steps.check.outputs.status }}
          CANARY: ${{ steps.check.outputs.canary }}
          BALANCE: ${{ steps.check.outputs.balance }}
          BASELINE: ${{ steps.check.outputs.baseline }}
          TX: ${{ steps.check.outputs.tx }}
          ERROR: ${{ steps.check.outputs.error }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash scripts/watchdog-alert.sh

  watch-mainnet:
    # Off until the mainnet canary exists, so no "missing" alert is opened before launch.
    if: vars.MAINNET_CANARY == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      # app/.npmrc sets ignore-scripts, so no dependency runs code at install time.
      - run: npm ci
      - id: check
        run: node scripts/watchdog.mjs
        env:
          CLUSTER: mainnet
          # Optional: a keyed mainnet RPC URL. Defaults to https://api.mainnet-beta.solana.com.
          RPC_URL: ${{ secrets.MAINNET_RPC_URL }}
          # A mainnet key holding a little SOL, only for fees. Mainnet has no airdrop: without it the watchdog still
          # reads and reports, but cannot trip the canary itself (the alert then says so).
          WATCHDOG_KEYPAIR: ${{ secrets.WATCHDOG_MAINNET_KEYPAIR }}
          FORCE_CHECK: ${{ inputs.force_check && '1' || '' }}
      - name: Open an alert issue
        if: steps.check.outputs.status != 'alive'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CLUSTER: mainnet
          LABEL: canary-mainnet
          STATUS: ${{ steps.check.outputs.status }}
          CANARY: ${{ steps.check.outputs.canary }}
          BALANCE: ${{ steps.check.outputs.balance }}
          BASELINE: ${{ steps.check.outputs.baseline }}
          TX: ${{ steps.check.outputs.tx }}
          ERROR: ${{ steps.check.outputs.error }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash scripts/watchdog-alert.sh
